resources:
  jobs:
    CineData_Medallion_Pipeline:
      name: CineData_Medallion_Pipeline
      schedule:
        quartz_cron_expression: 58 0 12 * * ?
        timezone_id: America/Fortaleza
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/arturvpf3@gmail.com/Drafts/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/arturvpf3@gmail.com/Drafts/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/arturvpf3@gmail.com/Drafts/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
